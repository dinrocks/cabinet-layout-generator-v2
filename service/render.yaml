# Render deployment for the ezdxf service (free web service).
# In Render: New + → Blueprint → pick this repo, or create a Web Service manually
# with Root Directory = service and the build/start commands below.
services:
  - type: web
    name: cabinet-ezdxf
    runtime: python
    rootDir: service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      # comma-separated; set to the deployed frontend origin (Cloudflare Pages URL
      # or the custom domain), e.g. https://cabinet-layout-generator-v2.pages.dev
      - key: ALLOWED_ORIGINS
        sync: false
      # Fail CLOSED: with this set, a missing SUPABASE_JWT_SECRET makes the service
      # 503 instead of silently opening. Keep it "1" in every deployed environment.
      - key: REQUIRE_AUTH
        value: "1"
      # Supabase JWT secret (Settings → API). When set, /upload · /export · /block
      # require a valid Supabase token. Set via the dashboard, not committed.
      - key: SUPABASE_JWT_SECRET
        sync: false
